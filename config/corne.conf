# Increase the BLE radio transmission power of the keyboard to resolve latency and poor left-right communication issues
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Change the default display name of the keyboard
CONFIG_ZMK_KEYBOARD_NAME="Morten's Corne"

# Fix the Windows battery bug
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Enable OLED display
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y
CONFIG_ZMK_LV_FONT_DEFAULT_SMALL_MONTSERRAT_26=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_26=y

CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=20
